      - Backoffice partners
    summary: Cadastra organização e lugar parceiro
    description: Cria as entidades globais e a participação no polo atomicamente sem expor CNPJ na resposta.
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/PartnerOnboarding
