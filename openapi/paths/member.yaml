account:
  get:
    operationId: getCurrentAccount
    tags:
      - Account
    summary: Retorna a conta autenticada
    responses:
      '200':
        $ref: ../responses.yaml#/AccountOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized

access:
  get:
    operationId: getCurrentAccessBootstrap
    tags:
      - Account
    summary: Retorna polos, roles e capabilities atuais para navegação
    description: É um bootstrap de cliente, não uma autorização reutilizável; cada comando reautoriza no banco.
    responses:
      '200':
        $ref: ../responses.yaml#/AccessOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

profile:
  get:
    operationId: getCurrentProfile
    tags:
      - Account
    summary: Retorna o perfil civil da conta
    description: CPF e telefone são representados apenas por presença/verificação, nunca em claro.
    responses:
      '200':
        $ref: ../responses.yaml#/ProfileOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
  put:
    operationId: putCurrentProfile
    tags:
      - Account
    summary: Cria ou atualiza o perfil civil
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/Profile
    responses:
      '200':
        $ref: ../responses.yaml#/ProfileOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

privacyConsents:
  get:
    operationId: listCurrentConsents
    tags:
      - Privacy
    summary: Lista o estado atual dos consentimentos
    responses:
      '200':
        $ref: ../responses.yaml#/ConsentListOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '409':
        $ref: ../components.yaml#/responses/Conflict

privacyConsent:
  parameters:
    - $ref: ../components.yaml#/parameters/PurposeCode
  put:
    operationId: putCurrentConsent
    tags:
      - Privacy
    summary: Concede ou retira consentimento
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/Consent
    responses:
      '200':
        $ref: ../responses.yaml#/ConsentOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

privacyRequests:
  get:
    operationId: listCurrentPrivacyRequests
    tags:
      - Privacy
    summary: Lista solicitações LGPD da conta
    responses:
      '200':
        $ref: ../responses.yaml#/PrivacyRequestListOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '409':
        $ref: ../components.yaml#/responses/Conflict
  post:
    operationId: createPrivacyRequest
    tags:
      - Privacy
    summary: Abre uma solicitação LGPD idempotente
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/PrivacyRequest
    responses:
      '200':
        $ref: ../responses.yaml#/PrivacyRequestOk
      '201':
        $ref: ../responses.yaml#/PrivacyRequestCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

subscriptions:
  get:
    operationId: listCurrentSubscriptions
    tags:
      - Subscriptions
    summary: Lista contratos do membro em todos os polos
    parameters:
      - $ref: ../components.yaml#/parameters/Limit
      - $ref: ../components.yaml#/parameters/After
    responses:
      '200':
        $ref: ../responses.yaml#/MemberSubscriptionsOk
      '400':
        $ref: ../components.yaml#/responses/BadRequest
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

billing:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  get:
    operationId: getCurrentPoloBilling
    tags:
      - Billing
    summary: Retorna os acordos de cobrança do membro no polo
    responses:
      '200':
        $ref: ../responses.yaml#/BillingAgreementsOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

orders:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  post:
    operationId: placeOrder
    tags:
      - Billing
    summary: Cria um pedido para uma oferta publicada
    description: Preço, versão, política e pacote são revalidados no relógio transacional do banco.
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/Checkout
    responses:
      '201':
        $ref: ../responses.yaml#/CheckoutCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

paymentIntents:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
    - $ref: ../components.yaml#/parameters/OrderId
  post:
    operationId: createPaymentIntent
    tags:
      - Billing
    summary: Inicia o pagamento de um pedido
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/PaymentIntent
    responses:
      '201':
        $ref: ../responses.yaml#/PaymentIntentCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity
      '502':
        $ref: ../components.yaml#/responses/BadGateway
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

billingAgreements:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
    - $ref: ../components.yaml#/parameters/OrderId
  post:
    operationId: createBillingAgreement
    tags:
      - Billing
    summary: Inicia um acordo de cobrança recorrente para o pedido
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    responses:
      '201':
        $ref: ../responses.yaml#/BillingAgreementCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity
      '502':
        $ref: ../components.yaml#/responses/BadGateway
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

redemptionDevices:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  post:
    operationId: enrollRedemptionDevice
    tags:
      - Devices
    summary: Autoriza uma instalação para resgates do contrato
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/RedemptionDevice
    responses:
      '200':
        $ref: ../responses.yaml#/RedemptionDeviceOk
      '201':
        $ref: ../responses.yaml#/RedemptionDeviceCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

deviceKey:
  parameters:
    - $ref: ../components.yaml#/parameters/DeviceId
  get:
    operationId: getCurrentDeviceKey
    tags:
      - Devices
    summary: Retorna a chave pública ativa do dispositivo
    responses:
      '200':
        $ref: ../responses.yaml#/DeviceKeyOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
  put:
    operationId: putCurrentDeviceKey
    tags:
      - Devices
    summary: Registra ou substitui a chave pública com prova de posse
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/DeviceKey
    responses:
      '200':
        $ref: ../responses.yaml#/DeviceKeyOk
      '201':
        $ref: ../responses.yaml#/DeviceKeyCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

redemptionGrants:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  post:
    operationId: issueRedemptionGrant
    tags:
      - Redemptions
    summary: Emite um grant curto para uma alocação disponível
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/RedemptionGrant
    responses:
      '201':
        $ref: ../responses.yaml#/RedemptionGrantCreated
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

reviewMediaRegistration:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
    - $ref: ../components.yaml#/parameters/PlaceId
    - $ref: ../components.yaml#/parameters/ReviewId
  post:
    operationId: registerReviewMedia
    tags:
      - Reviews
    summary: Vincula uma mídia já verificada a uma avaliação
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/ReviewMedia
    responses:
      '200':
        $ref: ../responses.yaml#/ReviewMediaOk
      '201':
        $ref: ../responses.yaml#/ReviewMediaCreated
      '400':
        $ref: ../components.yaml#/responses/BadRequest
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

reviewReports:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
    - $ref: ../components.yaml#/parameters/PlaceId
    - $ref: ../components.yaml#/parameters/ReviewId
  post:
    operationId: reportReview
    tags:
      - Reviews
    summary: Denuncia uma avaliação publicada de outro autor
    parameters:
      - $ref: ../components.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components.yaml#/schemas/ReviewReport
    responses:
      '201':
        $ref: ../responses.yaml#/ReviewReportCreated
      '400':
        $ref: ../components.yaml#/responses/BadRequest
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '409':
        $ref: ../components.yaml#/responses/Conflict
      '422':
        $ref: ../components.yaml#/responses/UnprocessableEntity

orderHistory:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  get:
    operationId: listCurrentOrders
    tags:
      - Billing
    summary: Lista pedidos do membro no polo
    parameters:
      - $ref: ../components.yaml#/parameters/Limit
      - $ref: ../components.yaml#/parameters/After
    responses:
      '200':
        $ref: ../responses.yaml#/MemberOrdersOk
      '400':
        $ref: ../components.yaml#/responses/BadRequest
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

redemptionHistory:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  get:
    operationId: listCurrentRedemptions
    tags:
      - Redemptions
    summary: Lista resgates do membro no polo
    parameters:
      - $ref: ../components.yaml#/parameters/Limit
      - $ref: ../components.yaml#/parameters/After
    responses:
      '200':
        $ref: ../responses.yaml#/MemberRedemptionsOk
      '400':
        $ref: ../components.yaml#/responses/BadRequest
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
      '503':
        $ref: ../components.yaml#/responses/ServiceUnavailable

wallet:
  parameters:
    - $ref: ../components.yaml#/parameters/PoloSlug
  get:
    operationId: getCurrentWallet
    tags:
      - Redemptions
    summary: Retorna vouchers e saldos atuais do membro no polo
    responses:
      '200':
        $ref: ../responses.yaml#/WalletOk
      '401':
        $ref: ../components.yaml#/responses/Unauthorized
      '404':
        $ref: ../components.yaml#/responses/NotFound
