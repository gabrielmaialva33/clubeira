User:
  type: object
  required:
    - id
    - email
    - email_verified_at
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    email:
      type: string
      format: email
    email_verified_at:
      oneOf:
        - $ref: ./components.yaml#/schemas/DateTime
        - type: 'null'

SessionData:
  type: object
  required:
    - access_token
    - token_type
    - expires_at
    - user
  properties:
    access_token:
      type: string
      description: Token opaco devolvido somente na criação da sessão.
    token_type:
      type: string
      const: Bearer
    expires_at:
      $ref: ./components.yaml#/schemas/DateTime
    user:
      $ref: '#/User'

SessionResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/SessionData'

AccountData:
  type: object
  required:
    - user
    - session
  properties:
    user:
      $ref: '#/User'
    session:
      type: object
      required:
        - expires_at
      properties:
        expires_at:
          $ref: ./components.yaml#/schemas/DateTime

AccountResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/AccountData'

AccessScope:
  type: object
  required:
    - roles
    - capabilities
  properties:
    roles:
      type: array
      items:
        type: string
    capabilities:
      type: array
      items:
        type: string

PoloAccess:
  allOf:
    - $ref: '#/AccessScope'
    - type: object
      required:
        - id
        - slug
        - name
        - timezone
        - status
      properties:
        id:
          $ref: ./components.yaml#/schemas/UUID
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        status:
          type: string

AccessResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - platform
        - polos
      properties:
        platform:
          $ref: '#/AccessScope'
        polos:
          type: array
          items:
            $ref: '#/PoloAccess'

ProfileIdentifier:
  type: object
  required:
    - kind
    - verified_at
  properties:
    kind:
      type: string
    verified_at:
      oneOf:
        - $ref: ./components.yaml#/schemas/DateTime
        - type: 'null'

ProfileContactPoint:
  type: object
  required:
    - kind
    - primary
    - verified_at
  properties:
    kind:
      type: string
    primary:
      type: boolean
    verified_at:
      oneOf:
        - $ref: ./components.yaml#/schemas/DateTime
        - type: 'null'

ProfileData:
  type: object
  required:
    - id
    - display_name
    - birth_date
    - status
    - identifiers
    - contact_points
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    display_name:
      type: string
    birth_date:
      type:
        - string
        - 'null'
      format: date
    status:
      type: string
    identifiers:
      type: array
      items:
        $ref: '#/ProfileIdentifier'
    contact_points:
      type: array
      items:
        $ref: '#/ProfileContactPoint'

ProfileResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/ProfileData'

ConsentData:
  type: object
  required:
    - processing_purpose
    - state
    - legal_document_version_id
    - occurred_at
  properties:
    processing_purpose:
      type: object
      required:
        - code
        - name
        - legal_basis
        - current_legal_document_version_id
      properties:
        code:
          type: string
        name:
          type: string
        legal_basis:
          type: string
        current_legal_document_version_id:
          $ref: ./components.yaml#/schemas/UUID
    state:
      type: string
    legal_document_version_id:
      oneOf:
        - $ref: ./components.yaml#/schemas/UUID
        - type: 'null'
    occurred_at:
      oneOf:
        - $ref: ./components.yaml#/schemas/DateTime
        - type: 'null'

ConsentResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/ConsentData'

ConsentListResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: '#/ConsentData'

PrivacyRequestEvent:
  type: object
  required:
    - event_type
    - payload
    - occurred_at
  properties:
    event_type:
      type: string
    payload:
      type: object
      additionalProperties: true
    occurred_at:
      $ref: ./components.yaml#/schemas/DateTime

PrivacyRequestData:
  type: object
  required:
    - id
    - client_request_id
    - request_type
    - status
    - due_at
    - completed_at
    - rejection_reason
    - inserted_at
    - updated_at
    - events
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    client_request_id:
      type: string
    request_type:
      type: string
    status:
      type: string
    due_at:
      $ref: ./components.yaml#/schemas/DateTime
    completed_at:
      oneOf:
        - $ref: ./components.yaml#/schemas/DateTime
        - type: 'null'
    rejection_reason:
      type:
        - string
        - 'null'
    inserted_at:
      $ref: ./components.yaml#/schemas/DateTime
    updated_at:
      $ref: ./components.yaml#/schemas/DateTime
    events:
      type: array
      items:
        $ref: '#/PrivacyRequestEvent'

PrivacyRequestResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/PrivacyRequestData'

PrivacyRequestListResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: '#/PrivacyRequestData'

PoloIdentity:
  type: object
  required:
    - id
    - slug
    - name
    - timezone
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    slug:
      type: string
    name:
      type: string
    timezone:
      type: string
    status:
      type: string

CityIdentity:
  type: object
  required:
    - id
    - name
    - subdivision_code
    - country_code
    - timezone
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    name:
      type: string
    subdivision_code:
      type: string
    country_code:
      type: string
      minLength: 2
      maxLength: 2
    timezone:
      type: string

PublicPolo:
  allOf:
    - $ref: '#/PoloIdentity'
    - type: object
      required:
        - city
      properties:
        city:
          $ref: '#/CityIdentity'

PublicPoloListResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/PublicPolo'
    meta:
      $ref: ./components.yaml#/schemas/CollectionMeta

LegalDocument:
  type: object
  required:
    - id
    - code
    - document_kind
    - locale
    - version
    - content_uri
    - content_sha256
    - required
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    code:
      type: string
    document_kind:
      type: string
    locale:
      type: string
    version:
      type: integer
      minimum: 1
    content_uri:
      type: string
    content_sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    required:
      type: boolean
      const: true

LegalDocumentListResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: '#/LegalDocument'

PageMeta:
  type: object
  required:
    - page
  properties:
    page:
      $ref: ./components.yaml#/schemas/Page

OfferPlace:
  type: object
  required:
    - polo_place_id
    - place_id
    - slug
    - name
  properties:
    polo_place_id:
      $ref: ./components.yaml#/schemas/UUID
    place_id:
      $ref: ./components.yaml#/schemas/UUID
    slug:
      type: string
    name:
      type: string

PublicBenefitOffer:
  type: object
  required:
    - offer_id
    - offer_version_id
    - version
    - code
    - name
    - title
    - description
    - terms
    - redemption_instructions
    - benefit
    - effective_during
    - places
  properties:
    offer_id:
      $ref: ./components.yaml#/schemas/UUID
    offer_version_id:
      $ref: ./components.yaml#/schemas/UUID
    version:
      type: integer
      minimum: 1
    code:
      type: string
    name:
      type: string
    title:
      type: string
    description:
      type: string
    terms:
      type: string
    redemption_instructions:
      type: string
    benefit:
      type: object
      required:
        - kind
        - percentage
        - amount
        - currency
      properties:
        kind:
          type: string
        percentage:
          type:
            - string
            - 'null'
        amount:
          type:
            - string
            - 'null'
        currency:
          type:
            - string
            - 'null'
    effective_during:
      $ref: ./components.yaml#/schemas/EffectivePeriod
    places:
      type: array
      items:
        $ref: '#/OfferPlace'

CatalogResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: object
      required:
        - polo
        - offers
      properties:
        polo:
          $ref: '#/PoloIdentity'
        offers:
          type: array
          items:
            $ref: '#/PublicBenefitOffer'
    meta:
      $ref: '#/PageMeta'

CheckoutOption:
  type: object
  required:
    - product_offering_version_id
    - offering_price_id
    - name
    - description
    - cycle
    - renewal_policy
    - price
  properties:
    product_offering_version_id:
      $ref: ./components.yaml#/schemas/UUID
    offering_price_id:
      $ref: ./components.yaml#/schemas/UUID
    name:
      type: string
    description:
      type: string
    cycle:
      type: object
      required:
        - policy
        - interval_unit
        - interval_count
      properties:
        policy:
          type: string
        interval_unit:
          type:
            - string
            - 'null'
        interval_count:
          type:
            - integer
            - 'null'
    renewal_policy:
      type: string
    price:
      type: object
      required:
        - key
        - currency
        - amount
        - billing_model
        - interval_unit
        - interval_count
        - installments
      properties:
        key:
          type: string
        currency:
          type: string
        amount:
          type: string
        billing_model:
          type: string
        interval_unit:
          type:
            - string
            - 'null'
        interval_count:
          type:
            - integer
            - 'null'
        installments:
          type: integer

CheckoutOptionsResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: object
      required:
        - polo
        - options
      properties:
        polo:
          $ref: '#/PoloIdentity'
        options:
          type: array
          items:
            $ref: '#/CheckoutOption'
    meta:
      $ref: '#/PageMeta'

PublicPlaceProfile:
  type: object
  required:
    - revision
    - contact
    - categories
    - weekly_hours
    - special_hours
  properties:
    revision:
      type: integer
      minimum: 1
    contact:
      type: object
      required:
        - email
        - phone
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
    categories:
      type: array
      items:
        type: object
        required:
          - key
          - name
        properties:
          key:
            type: string
          name:
            type: string
    weekly_hours:
      type: array
      items:
        $ref: '#/OpeningWindow'
    special_hours:
      type: array
      items:
        type: object
        required:
          - date
          - kind
          - windows
        properties:
          date:
            type: string
            format: date
          kind:
            type: string
          windows:
            type: array
            items:
              $ref: '#/ClockWindow'

OpeningWindow:
  allOf:
    - $ref: '#/ClockWindow'
    - type: object
      required:
        - weekday
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7

ClockWindow:
  type: object
  required:
    - opens_at
    - closes_at
    - closes_next_day
  properties:
    opens_at:
      type: string
      format: time
    closes_at:
      type: string
      format: time
    closes_next_day:
      type: boolean

PublicPlace:
  type: object
  required:
    - polo_place_id
    - place_id
    - slug
    - name
    - timezone
    - address
    - brands
    - operators
  properties:
    polo_place_id:
      $ref: ./components.yaml#/schemas/UUID
    place_id:
      $ref: ./components.yaml#/schemas/UUID
    slug:
      type: string
    name:
      type: string
    timezone:
      type: string
    address:
      type: object
      required:
        - street
        - number
        - complement
        - district
        - postal_code
        - latitude
        - longitude
        - city
      properties:
        street:
          type: string
        number:
          type:
            - string
            - 'null'
        complement:
          type:
            - string
            - 'null'
        district:
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        latitude:
          type:
            - string
            - 'null'
        longitude:
          type:
            - string
            - 'null'
        city:
          $ref: '#/CityIdentity'
    brands:
      type: array
      items:
        type: object
        additionalProperties: true
    operators:
      type: array
      items:
        type: object
        additionalProperties: true
    profile:
      oneOf:
        - $ref: '#/PublicPlaceProfile'
        - type: 'null'

PublicPlacesResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: object
      required:
        - polo
        - places
      properties:
        polo:
          $ref: '#/PoloIdentity'
        places:
          type: array
          items:
            $ref: '#/PublicPlace'
    meta:
      $ref: '#/PageMeta'

CheckoutOrder:
  type: object
  required:
    - id
    - order_number
    - status
    - currency
    - subtotal_amount
    - discount_amount
    - total_amount
    - placed_at
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    order_number:
      type: string
    status:
      type: string
    currency:
      type: string
    subtotal_amount:
      type: string
    discount_amount:
      type: string
    total_amount:
      type: string
    placed_at:
      $ref: ./components.yaml#/schemas/DateTime

CheckoutOrderResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/CheckoutOrder'

PaymentIntentData:
  type: object
  required:
    - id
    - order_id
    - provider
    - provider_reference
    - payment_method
    - status
    - amount
    - currency
    - expires_at
    - next_action
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    order_id:
      $ref: ./components.yaml#/schemas/UUID
    provider:
      type: string
    provider_reference:
      type:
        - string
        - 'null'
    payment_method:
      type:
        - string
        - 'null'
    status:
      type: string
    amount:
      type: string
    currency:
      type: string
    expires_at:
      $ref: ./components.yaml#/schemas/DateTime
    next_action:
      type: object
      additionalProperties: true

PaymentIntentResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/PaymentIntentData'

NullableDateTime:
  oneOf:
    - $ref: ./components.yaml#/schemas/DateTime
    - type: 'null'

NullablePeriod:
  oneOf:
    - $ref: ./components.yaml#/schemas/EffectivePeriod
    - type: 'null'

BillingAgreementStart:
  type: object
  required:
    - id
    - order_id
    - product_offering_version_id
    - provider
    - status
    - current_period
    - next_charge_at
    - next_action
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    order_id:
      $ref: ./components.yaml#/schemas/UUID
    product_offering_version_id:
      $ref: ./components.yaml#/schemas/UUID
    provider:
      type: string
    status:
      type: string
    current_period:
      $ref: '#/NullablePeriod'
    next_charge_at:
      $ref: '#/NullableDateTime'
    next_action:
      type: object
      additionalProperties: true

BillingAgreementStartResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/BillingAgreementStart'

BillingInvoice:
  type: object
  required:
    - id
    - order_id
    - invoice_number
    - billing_period
    - currency
    - subtotal_amount
    - discount_amount
    - total_amount
    - status
    - issued_at
    - due_at
    - paid_at
    - inserted_at
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    order_id:
      oneOf:
        - $ref: ./components.yaml#/schemas/UUID
        - type: 'null'
    invoice_number:
      type: string
    billing_period:
      $ref: '#/NullablePeriod'
    currency:
      type: string
    subtotal_amount:
      type: string
    discount_amount:
      type: string
    total_amount:
      type: string
    status:
      type: string
    issued_at:
      $ref: '#/NullableDateTime'
    due_at:
      $ref: '#/NullableDateTime'
    paid_at:
      $ref: '#/NullableDateTime'
    inserted_at:
      $ref: ./components.yaml#/schemas/DateTime

BillingAgreement:
  type: object
  required:
    - id
    - status
    - current_period
    - next_charge_at
    - cancelled_at
    - inserted_at
    - updated_at
    - order
    - product_offering_version
    - invoices
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    status:
      type: string
    current_period:
      $ref: '#/NullablePeriod'
    next_charge_at:
      $ref: '#/NullableDateTime'
    cancelled_at:
      $ref: '#/NullableDateTime'
    inserted_at:
      $ref: ./components.yaml#/schemas/DateTime
    updated_at:
      $ref: ./components.yaml#/schemas/DateTime
    order:
      type:
        - object
        - 'null'
      additionalProperties: true
    product_offering_version:
      type: object
      additionalProperties: true
    invoices:
      type: array
      items:
        $ref: '#/BillingInvoice'

BillingAgreementsResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - agreements
      properties:
        agreements:
          type: array
          items:
            $ref: '#/BillingAgreement'

MemberSubscription:
  type: object
  required:
    - id
    - status
    - starts_at
    - activated_at
    - ends_at
    - cancelled_at
    - offering
    - current_cycle
    - polo
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    status:
      type: string
    starts_at:
      $ref: '#/NullableDateTime'
    activated_at:
      $ref: '#/NullableDateTime'
    ends_at:
      $ref: '#/NullableDateTime'
    cancelled_at:
      $ref: '#/NullableDateTime'
    offering:
      type: object
      additionalProperties: true
    current_cycle:
      type:
        - object
        - 'null'
      additionalProperties: true
    polo:
      $ref: '#/PoloIdentity'

MemberSubscriptionsResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/MemberSubscription'
    meta:
      $ref: ./components.yaml#/schemas/CollectionMeta

OrderItem:
  type: object
  required:
    - id
    - product_offering_version_id
    - offering_price_id
    - name
    - description
    - quantity
    - unit_amount
    - total_amount
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    product_offering_version_id:
      $ref: ./components.yaml#/schemas/UUID
    offering_price_id:
      $ref: ./components.yaml#/schemas/UUID
    name:
      type: string
    description:
      type: string
    quantity:
      type: integer
    unit_amount:
      type: string
    total_amount:
      type: string

MemberOrder:
  allOf:
    - $ref: '#/CheckoutOrder'
    - type: object
      required:
        - cancelled_at
        - items
      properties:
        cancelled_at:
          $ref: '#/NullableDateTime'
        items:
          type: array
          items:
            $ref: '#/OrderItem'

MemberOrdersResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/MemberOrder'
    meta:
      $ref: ./components.yaml#/schemas/CollectionMeta

WalletVoucher:
  type: object
  required:
    - allocation_id
    - allocation_kind
    - issued_units
    - available_units
    - contract
    - cycle
    - subject
    - allowance
    - offer
    - places
  properties:
    allocation_id:
      $ref: ./components.yaml#/schemas/UUID
    allocation_kind:
      type: string
    issued_units:
      type: integer
    available_units:
      type: integer
    contract:
      type: object
      additionalProperties: true
    cycle:
      type: object
      additionalProperties: true
    subject:
      type: object
      additionalProperties: true
    allowance:
      type: object
      additionalProperties: true
    offer:
      type: object
      additionalProperties: true
    places:
      type: array
      items:
        type: object
        additionalProperties: true

WalletResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: object
      required:
        - polo
        - vouchers
      properties:
        polo:
          $ref: '#/PoloIdentity'
        vouchers:
          type: array
          items:
            $ref: '#/WalletVoucher'
    meta:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0

RedemptionDeviceData:
  type: object
  required:
    - id
    - access_contract_id
    - platform
    - status
    - authorized_at
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    access_contract_id:
      $ref: ./components.yaml#/schemas/UUID
    platform:
      type: string
    status:
      type: string
    authorized_at:
      $ref: ./components.yaml#/schemas/DateTime

RedemptionDeviceResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: '#/RedemptionDeviceData'

DeviceKeyData:
  type: object
  required:
    - id
    - device_installation_id
    - thumbprint
    - attestation
    - valid_from
    - valid_until
    - revoked_at
  properties:
    id:
      $ref: ./components.yaml#/schemas/UUID
    device_installation_id:
      $ref: ./components.yaml#/schemas/UUID
    thumbprint:
      type: string
    attestation:
      type: object
      additionalProperties: true
