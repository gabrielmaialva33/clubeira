components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token opaco retornado pelo login ou cadastro.
    validationPointAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Credencial do ponto no formato `Validation <segredo>`.
    mercadoPagoSignature:
      type: apiKey
      in: header
      name: x-signature
      description: Assinatura HMAC enviada pelo Mercado Pago.
    mercadoPagoRequestId:
      type: apiKey
      in: header
      name: x-request-id
      description: Identificador da entrega usado no manifesto assinado.
