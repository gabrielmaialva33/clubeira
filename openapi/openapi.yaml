openapi: 3.1.0
info:
  title: Clubeira API
  version: 1.0.0
  summary: API HTTP do Clubeira
  description: |
    Contrato público da API do Clubeira, um SaaS multi-tenant de clubes de
    vouchers por assinatura.

    IDs enviados pelo cliente nunca constituem autorização. Operações
    autenticadas revalidam usuário, polo, papel e capability no banco, sob RLS
    forçado. Respostas de erro respeitam `Accept-Language` e usam um código
    estável quando o cliente precisa distinguir uma condição de domínio.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Mesma origem da API
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Cadastro, sessão e recuperação de credenciais globais.
  - name: Account
    description: Conta, perfil e bootstrap de acesso do usuário autenticado.
  - name: Privacy
    description: Consentimentos e solicitações do titular.
  - name: Public directory
    description: Descoberta pública de polos, lugares e documentos legais.
  - name: Catalog
    description: Catálogo público e opções comerciais por polo.
  - name: Billing
    description: Checkout, pagamentos, cobranças e acordos recorrentes do membro.
  - name: Subscriptions
    description: Contratos e histórico de assinaturas do membro.
  - name: Devices
    description: Enrollment e chaves de dispositivos autorizados.
  - name: Redemptions
    description: Grants, confirmações e histórico de resgates.
  - name: Reviews
    description: Avaliações, mídia e denúncias.
  - name: Platform privacy
    description: Operações globais do encarregado de privacidade.
  - name: Platform billing
    description: Planos e cobrança SaaS da plataforma.
  - name: Backoffice partners
    description: Parceiros, acessos, lugares e convênios do polo.
  - name: Backoffice catalog
    description: Benefícios e ofertas comerciais do polo.
  - name: Backoffice billing
    description: Pagamentos, contratos e reembolsos do polo.
  - name: Backoffice operations
    description: Auditoria e operação da outbox do polo.
  - name: Backoffice validation
    description: Pontos e credenciais de validação do polo.
  - name: Backoffice reviews
    description: Filas e decisões de moderação do polo.
  - name: Partner
    description: Operações autorizadas do parceiro em seus lugares.
