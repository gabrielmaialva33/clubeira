name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and database contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
      CLUBEIRA_TEST_DB_HOST: localhost
      CLUBEIRA_TEST_DB_PORT: 5432
      CLUBEIRA_TEST_DB_USER: postgres
      CLUBEIRA_TEST_DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache Mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: quality-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.exs', 'mix.lock') }}

      - name: Install Mix tooling and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only test --check-locked
          mix deps.compile

      - name: Verify exact migration and runtime database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres \
            --file docker/postgres/init.sql
          MIX_ENV=prod \
            CLUBEIRA_DATABASE_ROLE_MODE=migrator \
            MIGRATOR_DATABASE_URL=ecto://clubeira_migrator:clubeira_migrator@localhost:5432/clubeira_dev \
            DATABASE_SSL=false \
            mix ecto.migrate --quiet
          PGPASSWORD=postgres \
            psql --host localhost --username postgres --dbname clubeira_dev \
            --file docker/postgres/provision-production.sql
          PGPASSWORD=clubeira_app \
            psql --host localhost --username clubeira_app --dbname clubeira_dev \
            --file docker/postgres/verify-runtime-role.sql

      - name: Verify reversible final schema
        run: |
          mix ecto.create
          mix ecto.migrate
          PGPASSWORD=postgres psql \
            --set ON_ERROR_STOP=1 \
            --host localhost \
            --username postgres \
            --dbname clubeira_test \
            --command "
              WITH city AS (
                INSERT INTO cities (
                  country_code, subdivision_code, external_code, name, timezone, status
                ) VALUES (
                  'BR', 'BR-CI', 'rollback-city', 'Rollback city',
                  'America/Sao_Paulo', 'active'
                )
                RETURNING id
              ), polo AS (
                INSERT INTO polos (city_id, name, timezone, status)
                SELECT id, 'Rollback polo', 'America/Sao_Paulo', 'active'
                FROM city
                RETURNING id
              )
              INSERT INTO polo_routes (polo_id, slug)
              SELECT id, 'rollback-polo' FROM polo;
            "
          mix ecto.rollback --all
          mix ecto.migrate
          if route_output=$(PGPASSWORD=postgres psql \
            --set ON_ERROR_STOP=1 \
            --host localhost \
            --username postgres \
            --dbname clubeira_test \
            --command "
              WITH city AS (
                INSERT INTO cities (
                  country_code, subdivision_code, external_code, name, timezone, status
                ) VALUES (
                  'BR', 'BR-CI', 'invalid-route-city', 'Invalid route city',
                  'America/Sao_Paulo', 'active'
                )
                RETURNING id
              ), polo AS (
                INSERT INTO polos (city_id, name, timezone, status)
                SELECT id, 'Invalid route polo', 'America/Sao_Paulo', 'active'
                FROM city
                RETURNING id
              )
              INSERT INTO polo_routes (polo_id, slug)
              SELECT id, 'Invalid_Route' FROM polo;
            " 2>&1); then
            echo "polo_routes accepted an invalid slug"
            exit 1
          fi
          echo "$route_output"
          if [[ "$route_output" != *"polo_routes_slug_check"* ]]; then
            echo "invalid route failed without the expected constraint"
            exit 1
          fi

      - name: Run quality gate
        run: mix quality

      - name: Compile production and build assets
        run: |
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix assets.deploy
          MIX_ENV=prod mix release --overwrite

      - name: Smoke-test idempotent production bootstrap
        env:
          CLUBEIRA_DATABASE_ROLE_MODE: migrator
          MIGRATOR_DATABASE_URL: ecto://clubeira_migrator:clubeira_migrator@localhost:5432/clubeira_dev
          DATABASE_SSL: "false"
        run: |
          bootstrap_file=$(mktemp)
          trap 'rm -f "$bootstrap_file"' EXIT
          jq \
            --arg content_file "$GITHUB_WORKSPACE/priv/static/legal/demo-consumer-terms-v1.txt" \
            '.legal.content_file = $content_file' \
            config/bootstrap.example.json >"$bootstrap_file"
          export CLUBEIRA_BOOTSTRAP_FILE="$bootstrap_file"

          first_result=$(_build/prod/rel/clubeira/bin/bootstrap)
          repeated_result=$(_build/prod/rel/clubeira/bin/bootstrap)

          jq --exit-status '.admin_status == "pending_registration"' <<<"$first_result"
          test "$repeated_result" = "$first_result"

      - name: Smoke-test the assembled release
        env:
          CLUBEIRA_DATABASE_ROLE_MODE: runtime
          DATABASE_URL: ecto://clubeira_app:clubeira_app@localhost:5432/clubeira_dev
          DATABASE_SSL: "false"
          SECRET_KEY_BASE: ci-only-secret-key-base-ci-only-secret-key-base-ci-only-secret-key-base
          PHX_HOST: localhost
          PORT: "4108"
          IDENTIFIER_ENCRYPTION_KEY_VERSION: "1"
          IDENTIFIER_ENCRYPTION_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
          IDENTIFIER_LOOKUP_KEY_BASE64: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
          PASSWORD_RESET_URL: https://localhost/reset-password
          EMAIL_VERIFICATION_URL: https://localhost/verify-email
          MAILER_FROM_EMAIL: no-reply@clubeira.local
          MAILER_PROVIDER: resend
          RESEND_API_KEY: ci-only-resend-key
        run: |
          _build/prod/rel/clubeira/bin/server >/tmp/clubeira-release.log 2>&1 &
          release_pid=$!

          cleanup() {
            kill -TERM "$release_pid" 2>/dev/null || true
            wait "$release_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=false
          for _attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4108/health >/dev/null; then
              healthy=true
              break
            fi

            if ! kill -0 "$release_pid" 2>/dev/null; then
              cat /tmp/clubeira-release.log
              exit 1
            fi

            sleep 1
          done

          if [[ "$healthy" != "true" ]]; then
            cat /tmp/clubeira-release.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:4108/ready >/dev/null

  container:
    name: Production container
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag clubeira:ci .

      - name: Verify container runtime identity
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' clubeira:ci)" = "nobody"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' clubeira:ci)" = '["/usr/bin/tini","--"]'
          docker run --rm --entrypoint /bin/sh clubeira:ci -c \
            'test "$(id -u)" = "65534" && test -x /app/bin/migrate && test -x /app/bin/bootstrap && test -x /app/bin/server'

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache Mix dependencies and PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: dialyzer-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.exs', 'mix.lock') }}

      - name: Install Mix tooling and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only dev --check-locked
          mix deps.compile

      - name: Run Dialyzer
        run: mix dialyzer
