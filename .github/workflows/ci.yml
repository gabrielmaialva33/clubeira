name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and database contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
      CLUBEIRA_TEST_DB_HOST: localhost
      CLUBEIRA_TEST_DB_PORT: 5432
      CLUBEIRA_TEST_DB_USER: postgres
      CLUBEIRA_TEST_DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache Mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: quality-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.exs', 'mix.lock') }}

      - name: Install Mix tooling and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only test --check-locked
          mix deps.compile

      - name: Verify exact migration and runtime database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres \
            --file docker/postgres/init.sql
          MIX_ENV=prod \
            CLUBEIRA_DATABASE_ROLE_MODE=migrator \
            MIGRATOR_DATABASE_URL=ecto://clubeira_migrator:clubeira_migrator@localhost:5432/clubeira_dev \
            SECRET_KEY_BASE=ci-only-secret-key-base-ci-only-secret-key-base-ci-only-secret-key-base \
            mix ecto.migrate --quiet
          PGPASSWORD=clubeira_app \
            psql --host localhost --username clubeira_app --dbname clubeira_dev \
            --file docker/postgres/verify-runtime-role.sql

      - name: Verify reversible final schema
        run: |
          mix ecto.create
          mix ecto.migrate
          PGPASSWORD=postgres psql \
            --set ON_ERROR_STOP=1 \
            --host localhost \
            --username postgres \
            --dbname clubeira_test \
            --command "
              WITH city AS (
                INSERT INTO cities (
                  country_code, subdivision_code, external_code, name, timezone, status
                ) VALUES (
                  'BR', 'BR-CI', 'rollback-city', 'Rollback city',
                  'America/Sao_Paulo', 'active'
                )
                RETURNING id
              ), polo AS (
                INSERT INTO polos (city_id, name, timezone, status)
                SELECT id, 'Rollback polo', 'America/Sao_Paulo', 'active'
                FROM city
                RETURNING id
              )
              INSERT INTO polo_routes (polo_id, slug)
              SELECT id, 'rollback-polo' FROM polo;
            "
          mix ecto.rollback --all
          mix ecto.migrate
          if route_output=$(PGPASSWORD=postgres psql \
            --set ON_ERROR_STOP=1 \
            --host localhost \
            --username postgres \
            --dbname clubeira_test \
            --command "
              WITH city AS (
                INSERT INTO cities (
                  country_code, subdivision_code, external_code, name, timezone, status
                ) VALUES (
                  'BR', 'BR-CI', 'invalid-route-city', 'Invalid route city',
                  'America/Sao_Paulo', 'active'
                )
                RETURNING id
              ), polo AS (
                INSERT INTO polos (city_id, name, timezone, status)
                SELECT id, 'Invalid route polo', 'America/Sao_Paulo', 'active'
                FROM city
                RETURNING id
              )
              INSERT INTO polo_routes (polo_id, slug)
              SELECT id, 'Invalid_Route' FROM polo;
            " 2>&1); then
            echo "polo_routes accepted an invalid slug"
            exit 1
          fi
          echo "$route_output"
          if [[ "$route_output" != *"polo_routes_slug_check"* ]]; then
            echo "invalid route failed without the expected constraint"
            exit 1
          fi

      - name: Run quality gate
        run: mix quality

      - name: Compile production and build assets
        run: |
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix assets.deploy

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache Mix dependencies and PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: dialyzer-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.exs', 'mix.lock') }}

      - name: Install Mix tooling and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only dev --check-locked
          mix deps.compile

      - name: Run Dialyzer
        run: mix dialyzer
